[project]
name = "flask-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.3",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Login==0.6.3",
    "Flask-Migrate==4.0.7",
    "PyMySQL==1.1.1",
    "cryptography==43.0.1",
    "python-dotenv==1.0.1",
    "razorpay==1.4.2",
    "setuptools>=70.0.0",
]

[tool.vercel]
entrypoint = "run:app"
